<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="Ayarlarla oynayarak kendi gezegenini yarat, üzerinde yaşamın doğup gelişmesini izle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Gezegen Atölyesi</title>
  </head>
  <body>
    <div id="viewport" aria-label="3B gezegen görünümü"></div>

    <header class="topbar">
      <div class="brand">
        <img src="/icons/icon-192.png" alt="" width="28" height="28" />
        <span id="app-title"></span>
      </div>
      <input id="planet-name" class="name-input" maxlength="40" autocomplete="off" spellcheck="false" />
      <div id="mode-switch" class="mode-switch" role="group"></div>
      <div class="actions">
        <button id="btn-random" class="btn" type="button"></button>
        <button id="btn-save" class="btn" type="button"></button>
        <button id="btn-album" class="btn" type="button"></button>
        <button id="btn-more" class="icon-btn" type="button"></button>
      </div>
    </header>

    <button id="mission-hud" class="mission-hud panel" type="button" hidden></button>
    <div id="photo-bar" class="photo-bar panel"></div>
    <div id="surface-bar" class="photo-bar surface-bar panel"></div>

    <aside id="settings" class="panel side left">
      <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Kapat"></button>
      <div id="settings-body"></div>
    </aside>

    <aside id="report" class="panel side right">
      <h2 id="report-title" class="panel-title"></h2>
      <div id="report-body"></div>
    </aside>

    <footer id="timeline" class="panel timeline"></footer>
    <nav id="mobile-tabs" class="mobile-tabs"></nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
